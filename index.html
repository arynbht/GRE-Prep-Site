<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRE Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans for UI, per the design-system font pairing.
         Literata stays on reading passages. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"
      rel="stylesheet"
    />
    <!-- Applies a stored theme override BEFORE first paint. Without this a
         dark-mode user sees one white frame on every load, which at 2am is the
         most visible quality defect a themed app can ship. Must stay inline,
         in <head>, with no defer/async. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vellum.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
